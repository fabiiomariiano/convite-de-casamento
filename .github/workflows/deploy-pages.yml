name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          set -euo pipefail

          mkdir _site
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.firebase/' \
            --exclude '_site/' \
            --exclude 'node_modules/' \
            --exclude 'firebase-config.js' \
            --exclude 'firebase-config.example.js' \
            --exclude 'firebase.json' \
            --exclude 'firestore.rules' \
            --exclude '.firebaserc' \
            --exclude '.gitignore' \
            --exclude '.nvmrc' \
            --exclude 'README.md' \
            --exclude 'FIREBASE_SETUP.md' \
            ./ _site/

          node <<'NODE'
          const fs = require("node:fs");

          const config = {
            apiKey: process.env.FIREBASE_API_KEY,
            authDomain: process.env.FIREBASE_AUTH_DOMAIN,
            projectId: process.env.FIREBASE_PROJECT_ID,
            storageBucket: process.env.FIREBASE_STORAGE_BUCKET,
            messagingSenderId: process.env.FIREBASE_MESSAGING_SENDER_ID,
            appId: process.env.FIREBASE_APP_ID,
          };

          const missing = Object.entries(config)
            .filter(([, value]) => !value)
            .map(([key]) => key);

          if (missing.length) {
            console.error(
              `Missing Firebase GitHub Secrets: ${missing.join(", ")}`,
            );
            process.exit(1);
          }

          const contents = `// Generated by GitHub Actions during deployment.
          window.firebaseConfig = ${JSON.stringify(config, null, 2)};

          window.isFirebaseConfigured = Boolean(
            window.firebaseConfig.apiKey
            && window.firebaseConfig.appId
          );
          `;

          fs.writeFileSync("_site/firebase-config.js", contents);
          NODE

          test -f _site/index.html
          test -f _site/styles.css
          test -f _site/script.js
          test -f _site/firebase-config.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
